<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Still Browser-Schutz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M12 2l8 4v6c0 5-4 8-8 10c-4-2-8-5-8-10V6z"/>
        </svg>
      </div>
      <div class="titles">
        <p class="eyebrow">Still</p>
        <h1>Browser-Schutz</h1>
      </div>
      <span class="status" id="status" aria-label="Status"></span>
    </header>

    <p class="connection" id="connection">Still wird gesucht …</p>

    <section class="stats" aria-label="Blockliste">
      <div>
        <strong id="count">–</strong>
        <span>aktive Website-Regeln</span>
      </div>
      <div class="right">
        <strong id="updated">–</strong>
        <span>zuletzt aktualisiert</span>
      </div>
    </section>

    <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>

    <div class="actions">
      <button class="ghost" id="refresh" type="button">Blockliste aktualisieren</button>
      <button class="primary" id="open" type="button">Still öffnen</button>
    </div>

    <footer>
      <span>Lokal über 127.0.0.1 · keine Cloud</span>
      <span id="version"></span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
